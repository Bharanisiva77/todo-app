<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TaskFlow{% endblock %} · TaskFlow</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', path='/style.css') }}" rel="stylesheet"></head>
<body>
{% if user %}<nav class="navbar navbar-expand-lg navbar-dark app-nav"><div class="container"><a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-check2-circle me-2"></i>TaskFlow</a><div class="d-flex align-items-center gap-3"><span class="text-white-50 small d-none d-sm-inline">Hi, {{ user.username }}</span><form method="post" action="/logout"><button class="btn btn-sm btn-outline-light">Log out <i class="bi bi-box-arrow-right ms-1"></i></button></form></div></div></nav>{% endif %}
<main class="container py-4 py-lg-5">
{% if flash %}<div class="alert alert-{{ flash.category }} alert-dismissible fade show shadow-sm" role="alert">{{ flash.message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endif %}
{% block content %}{% endblock %}
</main>
<footer class="text-center text-secondary small py-4">TaskFlow · Make progress, one task at a time.</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', path='/app.js') }}"></script>
</body></html>
